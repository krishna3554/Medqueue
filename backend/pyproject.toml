[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "medqueueai-backend"
version = "0.1.0"
description = "Prototype API and queue/triage logic for MedQueueAI"
requires-python = ">=3.12"
dependencies = [
  "bcrypt==4.3.0",
  "fastapi==0.128.0",
  "joblib==1.4.2",
  "pandas==2.2.3",
  "PyJWT==2.10.1",
  "PyYAML==6.0.3",
  "scikit-learn==1.7.1",
  "shap==0.48.0",
  "SQLAlchemy==2.0.45",
  "uvicorn[standard]==0.40.0",
  "xgboost==3.0.2",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.0.2", "ruff==0.15.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
